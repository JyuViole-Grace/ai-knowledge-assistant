services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  rag:
    build: .
    depends_on:
      - ollama
    environment:
      OLLAMA_URL: http://ollama:11434
      RAG_DOCS_ROOT: /data/documents
      # RAG_API_KEY: change-me
    volumes:
      - ./documents:/data/documents:ro
      - hf_cache:/models
      - rag_cache:/app/.rag_cache
    ports:
      - "8000:8000"

volumes:
  ollama:
  hf_cache:
  rag_cache:
